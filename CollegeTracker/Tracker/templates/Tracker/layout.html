{% load static %}
<html lang="en">
    <head>
        <title>{% block title %} {% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="{% static 'Tracker/logoMAIN_TRANS.png' %}">
        <link href="{% static 'Tracker/styles.css' %}" rel="stylesheet">
    </head>
    <body>
    <header class="header">
        <a href="{% url 'Tracker:home' %}" class="header-link">
            <img src="{% static 'Tracker/logoMAIN.png' %}" alt="Match Map logo" class="logo">
            <h1 class="app-name">Match Map</h1>
        </a>
    </header>

    {% if user.is_authenticated %}
        <div class="logout-fab">
            <span class="logout-fab-user">
                <span class="logout-fab-avatar">{{ user.username|slice:":1"|upper }}</span>
                <span class="logout-fab-username">{{ user.username }}</span>
            </span>
            <a href="{% url 'Tracker:logout' %}" class="logout-fab-btn" title="Log out">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Log out</span>
            </a>
        </div>
    {% endif %}

        <main>
            {% block main %} {% endblock %}
        </main>

        <footer class="footer">
            <!-- Left: Made by section -->
        <div class="footer-left">
            <span class="made-by">Made by Jet Locati</span>
            <a href="https://github.com/jtlocati" class="footer-link" target="_blank" rel="noopener noreferrer">
                <img src="{% static 'Tracker/GITHUB_logo.webp' %}" alt="GitHub" class="icon">
                Github
            </a>
            <a href="https://www.linkedin.com/in/jet-locati-ab2b11333/" class="footer-link" target="_blank" rel="noopener noreferrer">
                <img src="{% static 'Tracker/LinkedIn_logo_initials.png' %}" alt="LinkedIn" class="icon">
                Linkedin
            </a>
            <a href="https://www.bhscodingclub.com/" class="footer-link" target="_blank" rel="noopener noreferrer">
                <img src="{% static 'Tracker/BHSCC_logo.png' %}" alt="LinkedIn" class="icon">
                 BHS Coding Club 
            </a>
            </div>

</html>
