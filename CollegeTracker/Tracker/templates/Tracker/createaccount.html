{% extends "Tracker/Layout.html" %}

{% block title %} Create Account {% endblock %}

{% block main %}
{% load static %}
<div class="login-main">
    <div class="login-card">
        <h2 class="login-title">Create Account</h2>
        {% if password1 != password2 %}
            <h2 class="login-title">passwords do not match</h2>
        {% endif %}

        <form class="login-form" action="#" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3" maxlength="150">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password1">Password</label>
                <input type="password" id="password1" name="password1" placeholder="Create a password" required minlength="8">
            </div>

            <div class="form-group">
                <label for="password2">Confirm Password</label>
                <input type="password" id="password2" name="password2" placeholder="Re-enter your password" required minlength="8">
            </div>

            <button type="submit" class="login-button">Create Account</button>

        </form>

        <p class="signup-prompt">
            Already have an account?
            <a href="{% url 'Tracker:login' %}" class="signup-link">Log in</a>
        </p>
    </div>
</div>


{% endblock %}
